# Global configuration. Per-room overrides live in config/rooms/*.yaml.
models:
  backend: stub            # "ultralytics" for real YOLOv8 + ByteTrack + pose; "stub" for demo/tests
  detector_weights: yolov8n.pt
  pose_weights: yolov8n-pose.pt
  device: cpu              # "cuda:0" on a GPU box
  detection_conf: 0.4

process_fps: 10

clips:
  pre_roll_s: 10
  post_roll_s: 10
  fps: 10
  directory: data/clips
  format: mjpeg_dir

retention:
  unreviewed_hours: 48     # never-reviewed clips are purged after this
  dismissed_hours: 24      # clips a human dismissed as false positives
  actionable_days: 90      # clips a human confirmed as actionable
  sweep_interval_s: 300

debounce:
  per_track_cooldown_s: 120
  per_room_cooldown_s: 30
  merge_into_open_alert: true

storage:
  sqlite_path: data/monitor.db

# AI second opinion on each saved clip via a local Ollama vision model. Advisory only.
#   ollama pull qwen3-vl:8b
verifier:
  enabled: false
  base_url: http://localhost:11434
  model: qwen3-vl:8b
  frame_offsets_s: [-6, -3, -1, 0, 2, 5]
  tile_width: 480
  timeout_s: 180

dashboard:
  host: 0.0.0.0
  port: 8080
  preview_fps: 4

default_thresholds:
  fighting:
    window_s: 4.0
    min_duration_s: 3.0        # sustained signal required; single-frame spikes never fire
    min_active_fraction: 0.6
  sleeping:
    min_duration_s: 20.0
  out_of_seat:
    min_duration_s: 8.0
  talking:
    enabled: true              # LOW confidence from video alone (head-turn cue only, capped at
                               # 0.35). Never treat a talking alert as evidence on its own; see
                               # the README section on adding an audio channel.
