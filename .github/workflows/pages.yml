name: Deploy demo to GitHub Pages

on:
  push:
    # The github-pages environment only allows deployments from the repository's
    # default branch, which is this one. Pushing docs/ to another branch will be
    # rejected by the environment before any step runs.
    branches: [claude/trusting-lamport-a07jjo]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
