[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-monitor"
version = "0.1.0"
description = "Multi-classroom video monitoring with human-reviewed behavior alerts"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# Real camera ingestion + neural models. Not needed to run tests or the synthetic demo.
vision = [
    "opencv-python-headless>=4.9",
    "ultralytics>=8.1",      # YOLOv8 detection, YOLOv8-pose, built-in ByteTrack
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
classroom-monitor = "classroom_monitor.pipeline.runner:main"

[tool.setuptools.packages.find]
include = ["classroom_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
